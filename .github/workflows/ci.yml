name: Experiment 10 - CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check application file
        run: test -f index.html

      - name: Validate HTML content
        run: grep -q "Welcome to DevOps" index.html

      - name: Report success
        run: echo "CI pipeline completed successfully!"
